# Fakturace na Macu: aplikace běží jen na tomto počítači (http://localhost:3000).
# Spouští se dvojklikem na „Spustit Fakturaci.command“, který si vše připraví sám.
name: fakturace
services:
  app:
    build:
      context: ..
    image: fakturace-local
    restart: unless-stopped
    ports:
      # jen localhost – z jiného počítače v síti se k aplikaci nikdo nedostane
      - "127.0.0.1:3000:3000"
    # nastavení leží mimo složku aplikace, aby přežilo nahrazení novou verzí
    env_file: ${FAKTURACE_ENV:?Spouštějte přes Spustit Fakturaci.command}
    environment:
      APP_URL: http://localhost:3000
      DATA_DIR: /data
      BACKUP_DIR: /zalohy
    volumes:
      - data:/data
      - ${ZALOHY_DIR:?Chybí ZALOHY_DIR v nastavení}:/zalohy

volumes:
  data:
